<div style="display: flex; flex-direction: column; gap: 24px;">
  <!-- Card: Spotify Player Overlay -->
  <div class="card">
    <div class="card-title">Widget de Spotify en Tiempo Real (OBS / Streamlabs)</div>
    <p style="font-size: 13px; color: var(--text-secondary);">
      Añade esta fuente de navegador a tu software de transmisión (OBS / Streamlabs) para mostrar la canción que está sonando en tiempo real con su carátula oficial.
    </p>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
      <label style="font-size: 12px; color: var(--text-muted); font-weight: 500;">URL para OBS (HTTP Puerto 3001 — sin bloqueo SSL):</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="overlay-url-ip" readonly value="http://127.0.0.1:3001/overlay" style="flex: 1; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-card); background: rgba(0,0,0,0.3); color: var(--accent-cyan); font-family: monospace; font-size: 13px;">
        <button class="btn btn-primary" onclick="copyOverlayUrl('overlay-url-ip', this)">Copiar URL</button>
      </div>
    </div>

    <!-- Recommended Dimensions -->
    <div style="display: flex; gap: 16px; margin-top: 12px;">
      <div style="padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); font-size: 12px;">
        <strong style="color: var(--text-primary);">Ancho recomendado:</strong> 500 px
      </div>
      <div style="padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); font-size: 12px;">
        <strong style="color: var(--text-primary);">Alto recomendado:</strong> 150 px
      </div>
    </div>

    <!-- Interactive Live Preview Box -->
    <div style="margin-top: 16px;">
      <label style="font-size: 12px; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 8px;">Vista previa en vivo (Fondo transparente):</label>
      <div style="padding: 16px; border-radius: 12px; background: repeating-conic-gradient(#111625 0% 25%, #0a0d18 0% 50%) 50% / 20px 20px; border: 1px dashed rgba(255,255,255,0.15);">
        <iframe src="/overlay" style="width: 100%; height: 120px; border: none; overflow: hidden;" scrolling="no"></iframe>
      </div>
    </div>
  </div>
</div>
